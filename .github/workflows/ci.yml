name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - prod
      - 'refactor/**'

jobs:
  tests:
    name: Tests & Quality Gates (PHP 8.3)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: envsogo_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, gd, intl, zip, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate

      - name: Run Migrations on Test DB
        env:
          DB_CONNECTION: envsogo_main
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: envsogo_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Run Test Suite
        env:
          DB_CONNECTION: envsogo_main
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: envsogo_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Run Pint
        run: vendor/bin/pint --test app/Actions app/Http/Requests tests/
